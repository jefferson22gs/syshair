# SysHair Supabase Configuration
project_id = "ocbwsaydgkiseeardjga"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/*", "https://syshair.vercel.app/*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true

[auth.sms]
enable_signup = false

[functions.generate-image-caption]
verify_jwt = false

# JWT do usuário é validado internamente via Auth getUser; vínculo do salão no servidor.
[functions.whatsapp-instances]
verify_jwt = false

# Webhook valida segredo privado por instância; não recebe JWT Supabase do provedor.
[functions.evolution-webhook]
verify_jwt = false

[functions.whatsapp-dispatch]
verify_jwt = true

[functions.broadcast-messages]
verify_jwt = false

# Webhook externo (Mercado Pago não envia JWT do Supabase)
[functions.mercadopago-webhook]
verify_jwt = false
